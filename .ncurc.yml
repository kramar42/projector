# Config for `npm-check-updates`, invoked through Bun by the `deps:check` /
# `deps:update` scripts. YAML lets the one exception explain itself.

reject:
  # @types/node tracks the floor in `engines`, not the newest release — it
  # describes both the node CI job's runtime and the Node-compatible surface
  # Bun exposes. Bump it when the floor moves, not incidentally.
  - '@types/node'
