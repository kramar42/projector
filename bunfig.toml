# Bun's isolated layout puts one copy of each package in a central store under
# `node_modules/.bun` and symlinks into it, instead of hoisting everything flat.
# A dependency this repo does not declare cannot resolve by accident, and on APFS
# the store uses `clonefile`, sharing blocks with Bun's global cache. A warm
# reinstall is milliseconds.
#
# This governs `bun install`, the project's only supported installer.
[install]
linker = "isolated"
