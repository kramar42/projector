# `bun run <script>` should mean what it says.
#
# A package.json script that spells `node` — every one here that runs this
# repo's own TypeScript does — is honoured literally by default, so with Node on
# PATH (mise puts it there) `bun run serve` would quietly execute under Node.
# This setting prepends a `node` symlink pointing at bun, so a script written
# for the floor runs under whichever runtime was asked for. It is exactly what
# `--bun` does per invocation.
#
# The one script this cannot rescue is `test`: `node --test` becomes
# `bun --test`, and Bun's runner is the subcommand `bun test`, not a flag. Two
# different programs, so run the suite as `bun test`.
[run]
bun = true

# pnpm's layout, on Bun's lockfile. `isolated` puts one copy of each package in a
# central store under `node_modules/.bun` and symlinks into it, instead of
# hoisting everything flat. Two things come with it: a dependency this repo does
# not declare stops resolving by accident, and on APFS the store is populated
# with `clonefile`, so the blocks are shared with Bun's global cache rather than
# copied. A warm reinstall is milliseconds.
#
# It only governs `bun install`. npm, pnpm and yarn lay out node_modules their
# own way, and CI installs with each of them.
[install]
linker = "isolated"
