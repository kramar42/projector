# Optional. mise is one way to install Bun; Homebrew or a system install is
# equally fine. `engines` in package.json is the runtime contract.
#
# Concrete versions, not `latest`. There is no lockfile for a runtime, so this
# file *is* the pin: `latest` would hand two people on two days different
# versions, which is the opposite of what a version manager is for. Bump it
# deliberately.
#
# Bun is the default runtime and the package manager. Node stays pinned because
# it is the floor `engines` promises and CI tests — and the fallback that works
# when Bun is not on a shell's PATH.
[tools]
bun = "1.4.0"
node = "26"
