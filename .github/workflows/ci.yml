# Bun is the default runtime and the only package manager; Node is the floor
# `engines` still promises, kept honest by one job. Two runtimes, not five
# toolchains — the pnpm and npm matrix proved a claim nobody was relying on.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bun:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise reads .mise.toml, which is the single runtime pin.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: cli runs
        run: bun run pj -- --help

  node:
    name: node (the engines floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The floor from `engines`. This is the job that catches a `Bun.`
          # API or a bun-only dependency slipping in — the code is
          # runtime-neutral on purpose, and a promise nothing exercises
          # quietly stops being true.
          node-version: '24'
      # The scripts spell bun now, so this job calls the tools directly —
      # which is also the proof that no script is load-bearing.
      - run: npm install --no-package-lock
      - run: npx tsc --noEmit
      - run: node --test
      - run: npx vite build
      - name: cli runs
        run: node src/cli/pj.ts --help
