# Two runtimes and three package managers, because the docs promise all of them.
# A promise nothing exercises is a promise that quietly stops being true.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bun:
    name: bun (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The version mise.toml pins, because that pin is what the docs tell a
          # reader to install. `latest` here would test something nobody has.
          bun-version: 1.4.0
      - run: bun install
      - run: bun run typecheck
      # `bun test`, not `bun run test`: the script body is `node --test`, and
      # substituting the runtime makes that `bun --test`, which is not a flag
      # Bun has. Its runner is a subcommand. This is the one script that cannot
      # be shared, and running it here is what proves the rest can be.
      - run: bun test
      # No `--bun` flag: bunfig.toml sets `[run] bun = true`, so `bun run`
      # substitutes itself for the `node` in a script body. Without it this
      # would silently build under whatever node the image ships.
      - run: bun run build
      - name: cli runs
        run: bun run pj -- --help

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from `engines`, and whatever is newest. Both ends, and
        # neither needs bumping: `24` is the version the docs promise, and
        # `latest` is what development actually happens on. The floor job is the
        # one that catches an API newer than this repo claims to support.
        node: ['24', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Explicit, because package.json deliberately carries no
          # `packageManager` field — pinning one there would make Corepack
          # refuse every other package manager.
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # `node --run`, not `pnpm pj`: this is also the check that a package
      # manager is not required to run a script.
      - name: cli runs
        run: node --run pj -- --help

  npm:
    name: npm (no lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      # No lockfile of npm's is committed, so this resolves fresh. That is the
      # point: it is the claim "any package manager works" being tested, and it
      # is also the early warning for a dependency that breaks on a new minor.
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
