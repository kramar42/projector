# Fixture vocabulary — declared here in full, so this vault stands alone.
# The intent: every declared value is carried by at least one note, so every
# chip renders at least once. Nothing pins that, so treat a value no note takes
# as a gap in the fixture rather than a promise kept — with one exception,
# `reviewer`, which is empty on purpose and says so where it is declared.

# The built-in axis, declared only to give it a key. Shape — type, values, open,
# single — is the built-in's and `pj check` refuses changing it, so this is the
# whole of what a vault may say about `project`.
project:
  # A key, so a derived row can draw its `g⇧R` hint — the one state an inbound
  # row has that no keyless axis reaches. `p` is priority's; `r` is the seed's
  # choice for the same reason.
  key: r

status:
  label: Status
  values: [planning, active, on-hold, done, archived]
  open: false
  single: true
  # No further work expected, whatever the outcome — abandonment counts,
  # on-hold does not. A closed note stops blocking whatever waits on it.
  closed: [done, archived]
  hue: green

priority:
  label: Priority
  values: [now, month, backlog, someday]
  open: false
  single: true
  hue: orange

due:
  label: Due
  type: date
  single: true
  buckets: { overdue: {upTo: -1, hue: red}, today: {upTo: 0, hue: yellow}, week: 7 }
  overflow: later

waiting_on:
  label: Waiting on
  values: [person-a, person-b, person-c, person-d, person-e, person-g, person-f]
  open: true
  blocking: true
  hue: yellow

energy:
  label: Energy
  values: [deep, shallow, decide, delegate]
  open: false
  single: true

domain:
  label: Domain
  values: [eventing, identity, master-data, workflow, observability, lifecycle]
  open: true

tech:
  label: Tech
  values: [k8s, aws, github, kafka, keycloak, quarkus, temporal, mongodb, devops]
  open: true
  hue: pink

layer:
  label: Layer
  values: [layer-1, layer-2, layer-3, layer-4, layer-5]
  open: false

source:
  label: Source
  values: [brain, trello, slack, jira, gmail, gdocs, git, claude]
  open: true

owner:
  label: Owner
  values: []
  open: true
  single: true

# The one deliberate exception to the rule at the top of this file: declared,
# and carried by no note on purpose. It is the only way to draw the state a
# vault reaches by declaring an axis and never using it — a board grouped by it
# shows three empty columns and a full `(none)`, which is indistinguishable from
# an over-tight filter unless something says so. `src/view/empty.ts` is what
# says so, and this is what lets it be seen. Give a note a `reviewer:` and the
# state stops being drawn.
reviewer:
  label: Reviewer
  values: [reviewer-a, reviewer-b, reviewer-c]
  open: false
  single: true

parent:
  label: Part of
  type: ref
  single: true
  hue: purple
  inverse: Children
  key: a

blocked_by:
  label: Blocked by
  type: ref
  blocking: true
  hue: red
  inverse: Blocks
