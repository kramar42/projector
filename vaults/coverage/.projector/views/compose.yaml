# A composition: the columns are the three rules beside this file, not values of
# an axis. `lists` is the one grouping axis whose values are other views, which is
# what lets a note land in two columns at once — the footer's "extra placements".
#
# `triage.yaml` beside it is the same mechanism over the three filing gaps; this
# one reaches a computed axis (`staleness`) as a column, which that one does not.
#
# `shape` is an ordinary control on it: switch to a table for sections, or to a
# graph for bands. The columns stay the columns.
shape: board
title: Compose
lists: [rule-no-project, rule-no-priority, rule-stale]
sort: [title:asc]
show: [project, priority, status]
